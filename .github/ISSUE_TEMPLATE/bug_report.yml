name: Report a problem
description: Something in Euthus didn't work as expected.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Euthus version
      description: Euthus menu → About Euthus.
      placeholder: "0.7"
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac and macOS
      description: Apple menu → About This Mac.
      placeholder: "MacBook Air M2, macOS 26.1"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Verse detection (listening)
        - Typing / browsing scripture
        - Outputs, projector or NDI
        - Themes or Media backgrounds
        - Slides, songs or notes
        - Installing or updating
        - Something else
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log (for detection problems)
      description: In Finder press ⇧⌘G, open ~/Library/Logs/Euthus.log and drag it here. Remove anything private first.
